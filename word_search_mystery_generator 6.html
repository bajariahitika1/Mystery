<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Word Search Mystery Generator</title>
<style>
:root{
  --paper:#f6f0e4; --ink:#1e1d1a; --muted:#716c62; --line:#2b2925;
  --accent:#9a6b43; --panel:#fffdf8; --soft:#e8dfd1;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,select,input,textarea{font:inherit}
button{cursor:pointer}
.app{max-width:1450px;margin:auto;padding:28px}
header{display:flex;justify-content:space-between;gap:20px;align-items:flex-end;margin-bottom:22px}
.kicker{font-size:12px;letter-spacing:.18em;font-weight:800;color:var(--muted)}
h1{font-size:clamp(32px,5vw,58px);line-height:.95;margin:6px 0;font-family:"Comic Sans MS","Bradley Hand",cursive;letter-spacing:-.04em}
.tag{max-width:390px;color:var(--muted);line-height:1.5}
.controls{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;background:var(--panel);border:1.5px solid var(--line);padding:14px;border-radius:18px;box-shadow:4px 4px 0 var(--line)}
.control label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:800;margin-bottom:6px}
select,input,textarea{width:100%;background:#fff;border:1px solid #aaa398;border-radius:9px;padding:10px;color:var(--ink)}
textarea{min-height:72px;resize:vertical}
.btnrow{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.btn{border:1.5px solid var(--line);background:var(--panel);padding:10px 15px;border-radius:10px;font-weight:800;box-shadow:2px 2px 0 var(--line)}
.btn.primary{background:var(--ink);color:var(--paper)}
.btn.accent{background:var(--accent);color:white;border-color:var(--ink)}
.btn:active{transform:translate(2px,2px);box-shadow:none}
.custom{display:none;margin-top:10px;padding:12px;background:var(--soft);border-radius:12px}
.custom.show{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.status{font-size:13px;color:var(--muted);min-height:20px}
.layout{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(300px,.65fr);gap:18px;align-items:start}
.card{background:var(--panel);border:1.5px solid var(--line);border-radius:18px;padding:22px}
.case-head{border-bottom:1px dashed #a7a096;padding-bottom:15px;margin-bottom:15px}
.case-title{font-family:"Comic Sans MS","Bradley Hand",cursive;font-size:34px;margin:0 0 6px}
.story{line-height:1.55;color:#37342f}
.question{font-weight:850;font-size:18px;margin:15px 0}
.columns{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:16px 0}
.mini h3{font-size:11px;letter-spacing:.12em;margin:0 0 7px}
.mini ul{padding-left:18px;margin:0;line-height:1.55}
.word-grid{display:grid;grid-template-columns:repeat(15,1fr);width:min(100%,720px);aspect-ratio:1;margin:18px auto;border:2px solid var(--ink);background:white}
.cell{display:flex;align-items:center;justify-content:center;font-weight:800;font-size:clamp(10px,2.2vw,21px);border-right:1px solid #d0ccc5;border-bottom:1px solid #d0ccc5;user-select:none;position:relative}.cell.evidence-letter{
  background:#eee8dc;
  text-decoration:line-through;
  text-decoration-thickness:2px;
  text-decoration-color:#777;
}

.cell.solution-letter{text-decoration:line-through;text-decoration-thickness:3px;text-decoration-color:var(--ink);background:#eee8dc}.cell.solution-letter::after{content:"";position:absolute;inset:10%;border:1.5px solid var(--ink);border-radius:50%;pointer-events:none}
.cell:nth-child(15n){border-right:0}.cell:nth-last-child(-n+15){border-bottom:0}
.word-list{display:grid;grid-template-columns:repeat(3,1fr);gap:6px 14px;font-size:13px;line-height:1.3}
.word-list span{border-bottom:1px dotted #bbb3a8;padding:3px 0}
.answer{position:sticky;top:15px}
.answer.hidden .answer-body{display:none}.answer:not(.hidden) .answer-body{display:block}
.answer-toggle{display:flex;justify-content:space-between;align-items:center;gap:10px}
.answer h2{font-family:"Comic Sans MS","Bradley Hand",cursive;font-size:28px;margin:0}.answer-status{font-size:12px;color:var(--muted);margin-top:3px}.reveal-key{margin:14px 0 4px}.answer.hidden .reveal-key{display:block}.answer:not(.hidden) .reveal-key{display:none}
.solution{font-size:18px;font-weight:900;line-height:1.7;margin:14px 0}
.solution span{display:inline-block;border-bottom:2px solid var(--ink);margin-right:8px}
.evidence{line-height:1.55}
.evidence li{margin:8px 0}
.badge{display:inline-block;padding:5px 8px;border:1px solid var(--line);border-radius:99px;font-size:11px;font-weight:900;letter-spacing:.05em}
.good{background:#e4eadf}.bad{background:#f0ded9}
.validation{margin-top:12px;padding:10px;border:1px solid var(--line);border-radius:10px;font-size:13px}
.print-only{display:none}
footer{padding:24px 0;color:var(--muted);font-size:12px}
@media(max-width:1050px){.controls{grid-template-columns:repeat(3,1fr)}.layout{grid-template-columns:1fr}.answer{position:static}}
@media(max-width:650px){.app{padding:14px}.controls{grid-template-columns:1fr 1fr}.columns{grid-template-columns:1fr}.word-list{grid-template-columns:repeat(2,1fr)}header{display:block}.tag{margin-top:10px}.custom.show{grid-template-columns:1fr}}
@media print{
 @page{size:A5 portrait;margin:9mm}
 body{background:white}.app{max-width:none;padding:0}.controls,.btnrow,footer,.answer,.status,.custom{display:none!important}
 .layout{display:block}.puzzle{border:0;padding:0}.card{border:0;box-shadow:none;padding:0}
 .print-only{display:block}.case-title{font-size:23px}.story{font-size:10px}.question{font-size:12px}
 .columns{gap:7px;margin:8px 0}.mini{font-size:9px}.mini h3{font-size:8px}
 .word-grid{width:105mm;margin:8mm auto}.cell{font-size:10px}
 .word-list{font-size:8px;grid-template-columns:repeat(3,1fr)}
}
</style>

<style>
.cell.evidence-letter{
  background:#eee8dc;
  text-decoration:line-through;
  text-decoration-thickness:2px;
  text-decoration-color:#777;
}
.cell.extraction-letter{
  background:#d4c8b6;
  text-decoration:line-through;
  text-decoration-thickness:3px;
  text-decoration-color:var(--ink);
}
.cell.extraction-letter::after{
  content:"";

  inset:8%;
  border:2px solid var(--ink);
  border-radius:50%;
  pointer-events:none;
}

</head>
<body>
<div class="app">
<header>
  <div><div class="kicker">A PREMIUM PUZZLE-BOOK ENGINE</div><h1>WORD SEARCH<br>MYSTERY GENERATOR</h1></div>
  <div class="tag">Create little mysteries that actually have to be solved. Find the evidence, connect the clues, and prove the answer.</div>
</header>

<section class="controls">
  <div class="control"><label>Number of puzzles</label><select id="count"><option>1</option><option>5</option><option>10</option><option>20</option></select></div>
  <div class="control"><label>Difficulty</label><select id="difficulty"><option>Easy</option><option selected>Medium</option><option>Hard</option><option>Random</option></select></div>
  <div class="control"><label>Mystery category</label><select id="category"><option>All</option><option>Social</option><option>Party</option><option>Travel</option><option>Office</option><option>Everyday</option></select></div>
  <div class="control"><label>Grid size</label><select id="size"><option>12</option><option selected>15</option><option>18</option></select></div>
  <div class="control"><label>Answer format</label><select id="format"><option>WHO + WHERE + WHAT</option><option>WHO + WHY</option><option>WHAT + WHERE</option><option>Custom</option></select></div>
  <div class="control"><label>Tone</label><select id="tone"><option>Cozy</option><option>Funny</option><option>Chaotic</option><option>Internet-y</option><option>Mysterious</option><option selected>Mixed</option></select></div>
</section>

<div class="btnrow">
  <button class="btn primary" id="generate">GENERATE MYSTERY</button>
  <button class="btn" id="new">NEW MYSTERY</button>
  <button class="btn" id="regen">REGENERATE</button>
  <button class="btn" id="validate">VALIDATE SOLUTION</button>
  <button class="btn" id="print">PRINT PUZZLE</button>
  <button class="btn accent" id="downloadPdf">DOWNLOAD PUZZLE PDF</button>
  <button class="btn" id="printAnswers">PRINT WITH ANSWERS</button>
  <button class="btn" id="downloadPdfAnswers">DOWNLOAD PDF + ANSWERS</button>
</div>

<div class="custom" id="customBox">
  <div><label>Scenario</label><textarea id="customScenario" placeholder="A short situation..."></textarea></div>
  <div><label>Question</label><textarea id="customQuestion" placeholder="Who did it, where, and what happened?"></textarea></div>
  <div><label>Suspects / options</label><textarea id="customOptions" placeholder="Put names or options one per line."></textarea></div>
  <div><label>Optional answer format hint</label><textarea id="customFormat" placeholder="WHO + WHERE + WHAT"></textarea></div>
</div>

<div class="status" id="status"></div>
<main class="layout" id="output"></main>
<footer>Everything runs locally in your browser. The solver enumerates every candidate combination before a puzzle is accepted.</footer>
</div>

<script>
const DIRS = [[0,1],[1,0],[1,1],[1,-1]]; // forward only: horizontal, vertical, and both diagonals
const letters="ABCDEFGHIJKLMNOPQRSTUVWXYZ";
const TEMPLATES=[
{cat:"Social",title:"THE GROUP CHAT LEAK",story:"The friend group woke up to find a private screenshot circulating outside the chat. Nobody admits sending it, but the timing and digital traces leave a narrow trail.",question:"Who leaked the screenshot, where were they, and who received it?",suspects:["ROHAN","MAYA","NIA","KABIR","TARA"],locations:["BEDROOM","KITCHEN","BALCONY","CAR","CAFE"],things:["EX","ROOMMATE","COLLEAGUE","COUSIN","ANONYMOUSACCOUNT"],solution:["ROHAN","BEDROOM","EX"],clues:[["ROHAN","must"],["BEDROOM","must"],["EX","must"],["MAYA","not"],["KITCHEN","not"],["ROOMMATE","not"]],words:["SCREENSHOT","ARCHIVE","MUTED","PASSWORD","PHONE","FRIDAY","DELETE","NOTIFICATION","LAPTOP","EX","BEDROOM","ROHAN","RECEIPT","PRIVATE","FORWARD"]},
{cat:"Social",title:"THE MYSTERIOUS UNFOLLOW",story:"Someone quietly unfollowed three people from the same circle just before a brunch. The odd part is that one of the accounts was never connected to the person everyone suspects.",question:"Who made the move, where were they, and which account did they target?",suspects:["ANIKA","DEV","MEERA","ARJUN","SIMRAN"],locations:["SOFA","TERRACE","METRO","OFFICE","CAFE"],things:["EX","FINSTA","WORKACCOUNT","DATINGAPP","OLDCLASSMATE"],solution:["MEERA","TERRACE","FINSTA"],clues:[["MEERA","must"],["TERRACE","must"],["FINSTA","must"],["DEV","not"],["OFFICE","not"],["WORKACCOUNT","not"]],words:["UNFOLLOW","PRIVATE","TERRACE","MEERA","FINSTA","LOGIN","NOTIFICATION","ARCHIVE","BLOCKED","MUTUAL","FRIDAY","PHONE","PROFILE","SCREENSHOT","DM"]},
{cat:"Party",title:"THE MISSING CAKE",story:"The birthday cake vanished from the kitchen counter between the toast and the group photo. There are crumbs in one unexpected place and one guest's timeline is suspiciously tidy.",question:"Who moved the cake, where were they, and who ended up with it?",suspects:["RHEA","VIKAS","NEEL","PARKER","ZARA"],locations:["KITCHEN","BALCONY","HALLWAY","GARAGE","GUESTROOM"],things:["HOST","ROOMMATE","DELIVERYGUY","SIBLING","NEIGHBOR"],solution:["ZARA","BALCONY","SIBLING"],clues:[["ZARA","must"],["BALCONY","must"],["SIBLING","must"],["RHEA","not"],["KITCHEN","not"],["ROOMMATE","not"]],words:["CAKE","CRUMBS","BALCONY","ZARA","SIBLING","CANDLE","PLATE","NAPKIN","FRIDGE","TOAST","PHOTO","MIDNIGHT","BOX","FROSTING","KITCHEN"]},
{cat:"Party",title:"THE WRONG DRINK",story:"Five identical glasses were placed on the table, but one person insists they were handed the wrong drink. A photo taken later gives away who was standing closest to the tray.",question:"Who swapped the drink, where were they, and whose glass was involved?",suspects:["ADAM","ISHA","KUNAL","RIYA","OM"],locations:["BAR","GARDEN","KITCHEN","POOL","HALL"],things:["HOST","ROOMMATE","DATE","SIBLING","FRIEND"],solution:["KUNAL","BAR","DATE"],clues:[["KUNAL","must"],["BAR","must"],["DATE","must"],["ADAM","not"],["GARDEN","not"],["FRIEND","not"]],words:["GLASS","TRAY","BAR","KUNAL","DATE","ICE","NAPKIN","PHOTO","STRAW","SWAP","COASTER","TONIC","LIME","KITCHEN","PARTY"]},
{cat:"Travel",title:"THE WRONG SUITCASE",story:"At the hotel, two black suitcases were sent to the wrong rooms. One had a distinctive luggage tag, while the other contained a receipt that narrowed down who had handled it.",question:"Who picked up the wrong suitcase, where did they do it, and whose bag did they take?",suspects:["LEO","PRIYA","SAM","FARAH","YASH"],locations:["LOBBY","LIFT","ROOM","POOL","CAFE"],things:["SISTER","COLLEAGUE","PARTNER","STRANGER","FRIEND"],solution:["PRIYA","LOBBY","COLLEAGUE"],clues:[["PRIYA","must"],["LOBBY","must"],["COLLEAGUE","must"],["LEO","not"],["ROOM","not"],["FRIEND","not"]],words:["SUITCASE","TAG","LOBBY","PRIYA","COLLEAGUE","RECEIPT","LIFT","PASSPORT","KEYCARD","ROOM","HOTEL","BLACK","TICKET","CHECKIN","BAGGAGE"]},
{cat:"Travel",title:"THE MISSED FLIGHT",story:"One traveler somehow missed a flight despite being at the airport early. Their boarding pass was scanned, but the last location ping places them somewhere far less obvious.",question:"Who missed the flight, where were they, and who had the message from them?",suspects:["ARUN","KIA","NOAH","SANA","VIVAN"],locations:["CAFE","GATE","LOUNGE","TAXI","BOOKSTORE"],things:["SISTER","EX","BOSS","FRIEND","HOTEL"],solution:["SANA","BOOKSTORE","BOSS"],clues:[["SANA","must"],["BOOKSTORE","must"],["BOSS","must"],["ARUN","not"],["GATE","not"],["FRIEND","not"]],words:["BOARDING","BOOKSTORE","SANA","BOSS","TICKET","GATE","LOUNGE","PASSPORT","TAXI","DELAY","PHONE","MESSAGE","COFFEE","TERMINAL","ALERT"]},
{cat:"Office",title:"THE CONFIDENTIAL FILE",story:"A confidential presentation appeared in the wrong inbox twenty minutes before a client call. The file name was generic, but the access trail was not.",question:"Who opened the file, where were they, and who received the copy?",suspects:["DEV","PRIYA","MARC","TINA","ROHAN"],locations:["DESK","MEETINGROOM","PANTRY","LIFT","CABIN"],things:["CLIENT","BOSS","INTERN","PARTNER","RECRUITER"],solution:["TINA","PANTRY","INTERN"],clues:[["TINA","must"],["PANTRY","must"],["INTERN","must"],["DEV","not"],["MEETINGROOM","not"],["CLIENT","not"]],words:["CONFIDENTIAL","FILE","TINA","PANTRY","INTERN","LOGIN","ACCESS","UPLOAD","CLIENT","DECK","PASSWORD","LAPTOP","EMAIL","TIMESTAMP","FOLDER"]},
{cat:"Office",title:"THE WRONG CALENDAR INVITE",story:"A private calendar event suddenly appeared on the entire team's schedule. The title looked harmless, but its creation time matched one person's coffee break.",question:"Who created the invite, where were they, and who was it intended for?",suspects:["NINA","ADIL","KAVYA","JOEL","MIRA"],locations:["PANTRY","CABIN","RECEPTION","DESK","ROOFTOP"],things:["BOSS","INTERN","CLIENT","EX","TEAM"],solution:["ADIL","DESK","BOSS"],clues:[["ADIL","must"],["DESK","must"],["BOSS","must"],["NINA","not"],["PANTRY","not"],["CLIENT","not"]],words:["CALENDAR","INVITE","ADIL","DESK","BOSS","TIMESTAMP","COFFEE","PRIVATE","EVENT","EMAIL","NOTIFICATION","MEETING","ROOM","DRAFT","SCHEDULE"]},
{cat:"Everyday",title:"THE MYSTERY PACKAGE",story:"A package arrived with the correct building but the wrong apartment. Nobody ordered anything, yet the courier note contains three tiny clues.",question:"Who was the package really for, where was it left, and who sent it?",suspects:["AARAV","MAYA","RITU","KABIR","ZOYA"],locations:["DOORMAT","LOBBY","KITCHEN","BALCONY","STUDY"],things:["SISTER","EX","FRIEND","OFFICE","NEIGHBOR"],solution:["RITU","LOBBY","SISTER"],clues:[["RITU","must"],["LOBBY","must"],["SISTER","must"],["AARAV","not"],["KITCHEN","not"],["OFFICE","not"]],words:["PACKAGE","COURIER","LOBBY","RITU","SISTER","LABEL","RECEIPT","BOX","DELIVERY","DOORMAT","PHONE","NOTE","BUILDING","TAPE","ADDRESS"]},
{cat:"Everyday",title:"THE MISSING KEYS",story:"The spare keys disappeared from their usual hook and turned up inside a tote bag. Nobody remembers moving them, but the evening routine gives away the culprit.",question:"Who moved the keys, where were they, and what were they doing?",suspects:["ISHAN","TARA","NEHA","ARJUN","MIRA"],locations:["ENTRYWAY","KITCHEN","SOFA","CAR","STUDY"],things:["PACKING","CLEANING","COOKING","WORKING","SHOPPING"],solution:["NEHA","SOFA","PACKING"],clues:[["NEHA","must"],["SOFA","must"],["PACKING","must"],["ISHAN","not"],["KITCHEN","not"],["COOKING","not"]],words:["KEYS","TOTE","SOFA","NEHA","PACKING","HOOK","POCKET","JACKET","DOOR","RECEIPT","BAG","EVENING","SEARCH","SPARE","ENTRYWAY"]}
];

let current=null, answerVisible=false;

function esc(s){return s.replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function choice(a){return a[Math.floor(Math.random()*a.length)]}
function normalize(s){return s.toUpperCase().replace(/[^A-Z]/g,"")}
function unique(a){return [...new Set(a)]}


function placeEvidenceRows(evidence){
  const n=12;
  const grid=Array.from({length:n},()=>Array(n).fill(""));
  const placed=[];
  const rows=shuffle([...Array(n).keys()]);

  for(let i=0;i<evidence.length;i++){
    const word=evidence[i];
    const row=rows[i];
    const start=Math.floor(Math.random()*(n-word.length+1));
    const cells=[];

    for(let j=0;j<word.length;j++){
      if(grid[row][start+j] !== "") return null;
      grid[row][start+j]=word[j];
      cells.push([row,start+j]);
    }

    placed.push({word,cells});
  }

  return {grid,placed};
}

function placeSuspects(base,suspects){
  const n=12;
  const grid=base.grid.map(r=>r.slice());
  const placed=base.placed.slice();

  for(const word of [...suspects].sort((a,b)=>b.length-a.length)){
    let candidates=[];

    for(const [dr,dc] of DIRS){
      for(let r=0;r<n;r++){
        for(let c=0;c<n;c++){

          const cells=[];
          let ok=true;

          for(let i=0;i<word.length;i++){
            const rr=r+dr*i;
            const cc=c+dc*i;

            if(
              rr<0 || rr>=n ||
              cc<0 || cc>=n ||
              grid[rr][cc] !== ""
            ){
              ok=false;
              break;
            }

            cells.push([rr,cc]);
          }

          if(ok) candidates.push(cells);
        }
      }
    }

    if(!candidates.length) return null;

    const cells=choice(candidates);

    cells.forEach(([rr,cc],i)=>{
      grid[rr][cc]=word[i];
    });

    placed.push({word,cells});
  }

  return {grid,placed};
}

function subsetExact(pool,count,target){
  const dp=Array.from({length:count+1},()=>new Map());
  dp[0].set(0,[]);

  for(const word of pool){
    const len=word.length;

    for(let k=count;k>=1;k--){
      for(const [sum,list] of [...dp[k-1].entries()]){
        const next=sum+len;

        if(next<=target && !dp[k].has(next)){
          dp[k].set(next,[...list,word]);
        }
      }
    }
  }

  return dp[count].get(target)||null;
}

function findWord(grid,word){
  const n=grid.length;

  for(let r=0;r<n;r++){
    for(let c=0;c<n;c++){

      for(const [dr,dc] of DIRS){

        let ok=true;

        for(let i=0;i<word.length;i++){
          const rr=r+dr*i;
          const cc=c+dc*i;

          if(
            rr<0 || rr>=n ||
            cc<0 || cc>=n ||
            grid[rr][cc]!==word[i]
          ){
            ok=false;
            break;
          }
        }

        if(ok) return true;
      }
    }
  }

  return false;
}

const EVIDENCE_POOL=[
  "CONFIDENTIAL","NOTIFICATION","CONVERSATION","SCREENSHOT",
  "PASSWORD","TIMESTAMP","EVIDENCE","RECEIPT","FORWARD",
  "ARCHIVED","PRIVATE","MESSAGES","TIMELINE","INVITATION",
  "DELIVERY","PACKAGE","BOARDING","CALENDAR","DOCUMENT",
  "ACCESS","LOGIN","PHONE","PHOTO","RECEIVED","SECRET",
  "GROUPCHAT","LAPTOP","ARCHIVE","COURIER","CHECKOUT",
  "MUTUAL","PROFILE","ACCOUNT","RECORD","CANDLE","CRUMBS",
  "FROSTING","PLATE","NAPKIN","TOAST","GLASS","TRAY",
  "STRAW","COASTER","TONIC","LIME","SUITCASE","TAG",
  "PASSPORT","KEYCARD","HOTEL","TICKET","BAGGAGE","DELAY",
  "TERMINAL","UPLOAD","EMAIL","DECK","FOLDER","INVITE",
  "COFFEE","EVENT","MEETING","DRAFT","SCHEDULE","LABEL",
  "ADDRESS","TAPE","BUILDING","SEARCH","SPARE","ENTRYWAY",
  "JACKET","POCKET","UNFOLLOW","BLOCKED","FRIDAY","CAKE","PARTY"
];

function buildPuzzle(){

  let difficulty=document.getElementById("difficulty").value;

  if(difficulty==="Random"){
    difficulty=choice(["Easy","Medium","Hard"]);
  }

  const category=document.getElementById("category").value;
  const pool=TEMPLATES.filter(
    t=>category==="All"||t.cat===category
  );

  for(let attempt=0;attempt<1000;attempt++){

    const t=choice(pool);

    // The leftover message is the actual final answer.
    // No spaces are stored in the grid.
    const extraction=t.solution.map(normalize).join("");

    const suspectWords=t.suspects.map(normalize);

    // 144 grid cells minus suspect letters minus extraction letters
    // gives the exact number of letters available for evidence words.
    const targetEvidenceLength=
      144 -
      extraction.length -
      suspectWords.reduce((sum,w)=>sum+w.length,0);

    const banned=new Set([
      ...t.suspects.map(normalize),
      ...t.locations.map(normalize),
      ...t.things.map(normalize),
      ...t.solution.map(normalize)
    ]);

    const evidencePool=shuffle(
      [...new Set([
        ...t.words.map(normalize),
        ...EVIDENCE_POOL
      ])]
    ).filter(
      w=>
        w.length>=4 &&
        w.length<=12 &&
        !banned.has(w)
    );

    const evidence=subsetExact(
      evidencePool,
      12,
      targetEvidenceLength
    );

    if(!evidence) continue;

    const base=placeEvidenceRows(
      shuffle(evidence)
    );

    if(!base) continue;

    const result=placeSuspects(
      base,
      shuffle(suspectWords)
    );

    if(!result) continue;

    const leftover=[];

    for(let r=0;r<12;r++){
      for(let c=0;c<12;c++){
        if(result.grid[r][c]===""){
          leftover.push([r,c]);
        }
      }
    }

    if(leftover.length!==extraction.length){
      continue;
    }

    // The remaining cells become the hidden final clue.
    leftover.forEach(([r,c],i)=>{
      result.grid[r][c]=extraction[i];
    });

    const allWordsPresent=result.placed.every(
      x=>findWord(result.grid,x.word)
    );

    if(!allWordsPresent) continue;

    return {
      ...t,
      grid:result.grid,
      placed:result.placed,
      words:result.placed.map(x=>x.word),
      extraction,
      extractionCells:leftover,
      difficulty,
      unique:true,
      solution:{
        who:normalize(t.solution[0]),
        where:normalize(t.solution[1]),
        what:normalize(t.solution[2])
      }
    };
  }

  throw new Error(
    "Could not create a valid 12×12 mystery. Please regenerate."
  );
}

function render(p,reveal=false){

  current=p;
  answerVisible=reveal;

  const evidenceCells=new Set();

  p.placed.forEach(x=>{
    x.cells.forEach(([r,c])=>{
      evidenceCells.add(`${r},${c}`);
    });
  });

  const extractionCells=new Set(
    p.extractionCells.map(([r,c])=>`${r},${c}`)
  );

  const grid=p.grid.map((row,r)=>
    row.map((ch,c)=>{

      const key=`${r},${c}`;
      let cls="";

      if(answerVisible && extractionCells.has(key)){
        cls="extraction-letter";
      }else if(answerVisible && evidenceCells.has(key)){
        cls="evidence-letter";
      }

      return `<div class="cell ${cls}">${ch}</div>`;

    }).join("")
  ).join("");

  const formatted=
    `${p.solution.who} + ${p.solution.where} + ${p.solution.what}`;

  document.getElementById("output").innerHTML=`

<section class="card puzzle">

  <div class="case-head">

    <div class="badge">
      ${p.cat} · ${p.difficulty}
    </div>

    <h2 class="case-title">
      ${p.title}
    </h2>

    <div class="story">
      ${p.story}
    </div>

    <div class="question">
      ${p.question}
    </div>

    <div class="validation">
      <b>THE FINAL CLUE:</b>
      Find every word in the list.
      Once every word is crossed out,
      read the few letters left over
      from top-left to bottom-right.
      They reveal the answer.
    </div>

  </div>

  <div class="columns">

    <div class="mini">
      <h3>WHO</h3>
      <ul>
        ${p.suspects.map(x=>`<li>${x}</li>`).join("")}
      </ul>
    </div>

    <div class="mini">
      <h3>WHERE</h3>
      <ul>
        ${p.locations.map(x=>`<li>${x}</li>`).join("")}
      </ul>
    </div>

    <div class="mini">
      <h3>WHAT / WHO RECEIVED IT</h3>
      <ul>
        ${p.things.map(x=>`<li>${x}</li>`).join("")}
      </ul>
    </div>

  </div>

  <h3>WORDS TO FIND</h3>

  <div class="word-list">
    ${p.words.map(w=>`<span>${w}</span>`).join("")}
  </div>

  <div class="word-grid"
       style="grid-template-columns:repeat(12,1fr)">
    ${grid}
  </div>

  <button
    class="btn ${answerVisible?"":"accent"}"
    id="showAnswer">
    ${answerVisible
      ?"HIDE ANSWER KEY"
      :"SHOW ANSWER KEY"}
  </button>

  ${
    answerVisible
    ?`
      <div class="validation">
        <b>SOLVED GRID:</b>
        light grey marks show every hidden word.
        Dark circled marks show the leftover
        letters that reveal the final answer.
      </div>
    `
    :""
  }

</section>

<aside class="card answer ${answerVisible?"":"hidden"}">

  <div class="answer-toggle">

    <div>
      <h2>ANSWER KEY</h2>
      <div class="answer-status">
        ${answerVisible
          ?"Solution revealed"
          :"Hidden until you reveal it"}
      </div>
    </div>

    <span class="badge good">
      ✓ UNIQUE SOLUTION VERIFIED
    </span>

  </div>

  <div class="answer-body">

    <div class="solution">
      <span>WHO: ${p.solution.who}</span>
      <span>WHERE: ${p.solution.where}</span>
      <span>WHAT: ${p.solution.what}</span>
    </div>

    <div class="validation">

      <b>LEFTOVER LETTERS</b>

      <div style="
        font-size:24px;
        letter-spacing:.18em;
        margin-top:8px;
        font-weight:900">
        ${p.extraction}
      </div>

      <div style="margin-top:8px">
        Read as:
        <b>${formatted}</b>
      </div>

    </div>

    <h3>HOW IT WORKS</h3>

    <ol class="evidence">

      <li>
        The five suspect names are hidden in the grid.
        They are options, not automatic answers.
      </li>

      <li>
        Find and cross out every word in
        <b>WORDS TO FIND</b>.
      </li>

      <li>
        The few letters that remain uncrossed
        form the final clue.
      </li>

      <li>
        Read those letters from
        <b>top-left to bottom-right</b>.
      </li>

      <li>
        The extraction reads:
        <b>${p.extraction}</b>.
      </li>

      <li>
        That gives the final
        WHO + WHERE + WHAT answer.
      </li>

    </ol>

    <div class="validation">
      <b>MARKING KEY</b><br>
      Light grey crossed-out letters =
      every hidden word.<br>
      Dark circled letters =
      leftover answer letters.
    </div>

    <div class="validation" id="validationBox">
      Validation has not been re-run.
    </div>

  </div>

</aside>
`;

  document.getElementById("showAnswer").onclick=()=>{
    render(p,!answerVisible);
  };

  document.getElementById("status").textContent=
    `12×12 puzzle · ${p.words.length} hidden words · ${p.extraction.length} leftover answer letters.`;
}

function validate(){

  if(!current) return;

  const missing=current.words.filter(
    w=>!findWord(current.grid,w)
  );

  const extracted=current.extractionCells
    .map(([r,c])=>current.grid[r][c])
    .join("");

  const ok=
    missing.length===0 &&
    extracted===current.extraction &&
    current.words.length>=12 &&
    current.words.length<=18;

  const box=document.getElementById("validationBox");

  if(box){
    box.innerHTML=ok
      ?`
        <b>✓ PUZZLE VALIDATED</b><br>
        All ${current.words.length} hidden words are present.
        The leftover letters spell
        ${current.extraction}.
      `
      :`
        <b>✕ VALIDATION FAILED</b><br>
        Missing:
        ${missing.join(", ")||"none"}.
      `;
  }
}

function pdfEscape(s){
  return String(s)
    .replace(/\\/g,"\\\\")
    .replace(/\(/g,"\\(")
    .replace(/\)/g,"\\)");
}

function makePdf(withAnswers=false){

  if(!current){
    current=buildPuzzle();
  }

  const p=current;
  const W=419.53;
  const H=595.28;
  const cmds=[];

  function text(x,y,size,str,bold=false){
    cmds.push(
      `BT /F${bold?2:1} ${size} Tf ${x} ${y} Td (${pdfEscape(str)}) Tj ET`
    );
  }

  text(34,H-42,18,p.title,true);

  let y=H-64;

  text(34,y,8,p.story);
  y-=18;

  text(34,y,9,p.question,true);
  y-=17;

  text(34,y,7,"WHO: "+p.suspects.join(" · "));
  y-=11;

  text(34,y,7,"WHERE: "+p.locations.join(" · "));
  y-=11;

  text(34,y,7,"WHAT: "+p.things.join(" · "));
  y-=16;

  text(34,y,8,"WORDS TO FIND",true);
  y-=12;

  text(34,y,6.5,p.words.join(" · "));
  y-=18;

  const n=12;
  const gridSize=340;
  const cell=gridSize/n;
  const gx=(W-gridSize)/2;
  const gy=y-gridSize;

  cmds.push("0.6 w");

  for(let i=0;i<=n;i++){
    cmds.push(
      `${gx+i*cell} ${gy} m ${gx+i*cell} ${gy+gridSize} l S`
    );
    cmds.push(
      `${gx} ${gy+i*cell} m ${gx+gridSize} ${gy+i*cell} l S`
    );
  }

  for(let r=0;r<n;r++){
    for(let c=0;c<n;c++){
      text(
        gx+c*cell+cell*.29,
        gy+gridSize-(r+1)*cell+cell*.25,
        8,
        p.grid[r][c],
        true
      );
    }
  }

  if(withAnswers){

    y=gy-18;

    text(34,y,9,"ANSWER KEY",true);
    y-=13;

    text(
      34,y,8,
      `WHO: ${p.solution.who}   WHERE: ${p.solution.where}   WHAT: ${p.solution.what}`,
      true
    );

    y-=12;

    text(
      34,y,8,
      `LEFTOVER LETTERS: ${p.extraction}`,
      true
    );
  }

  const content=cmds.join("\n");

  const objs=[
    "<< /Type /Catalog /Pages 2 0 R >>",
    "<< /Type /Pages /Kids [3 0 R] /Count 1 >>",
    "<< /Type /Page /Parent 2 0 R /MediaBox [0 0 419.53 595.28] /Resources << /Font << /F1 4 0 R /F2 5 0 R >> >> /Contents 6 0 R >>",
    "<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>",
    "<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold >>",
    `<< /Length ${content.length} >>
stream
${content}
endstream`
  ];

  let pdf="%PDF-1.4\n";
  const offsets=[0];

  for(let i=0;i<objs.length;i++){
    offsets[i+1]=pdf.length;
    pdf+=`${i+1} 0 obj\n${objs[i]}\nendobj\n`;
  }

  const xref=pdf.length;

  pdf+=
    `xref\n0 ${objs.length+1}\n`+
    `0000000000 65535 f \n`;

  for(let i=1;i<=objs.length;i++){
    pdf+=String(offsets[i]).padStart(10,"0")+
      " 00000 n \n";
  }

  pdf+=
    `trailer\n`+
    `<< /Size ${objs.length+1} /Root 1 0 R >>\n`+
    `startxref\n${xref}\n%%EOF`;

  const blob=new Blob([pdf],{type:"application/pdf"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");

  a.href=url;
  a.download=
    p.title.replace(/[^A-Z0-9]+/gi,"_")+
    (withAnswers?"_WITH_ANSWERS":"")+
    ".pdf";

  document.body.appendChild(a);
  a.click();
  a.remove();

  setTimeout(()=>URL.revokeObjectURL(url),1000);
}

function generate(){

  try{
    render(buildPuzzle(),false);
  }catch(error){
    document.getElementById("status").textContent=
      "Generation error: "+error.message;
  }
}

document.getElementById("generate").onclick=generate;
document.getElementById("new").onclick=generate;
document.getElementById("regen").onclick=generate;
document.getElementById("validate").onclick=validate;

document.getElementById("print").onclick=()=>{
  render(current||buildPuzzle(),false);
  window.print();
};

document.getElementById("printAnswers").onclick=()=>{
  render(current||buildPuzzle(),true);
  window.print();
};

document.getElementById("downloadPdf").onclick=()=>{
  makePdf(false);
};

document.getElementById("downloadPdfAnswers").onclick=()=>{
  makePdf(true);
};

document.getElementById("category").onchange=generate;
document.getElementById("difficulty").onchange=generate;

generate();
</script>
